name: schoolsm_mobile
description: "SchoolSM Mobile App for Android & iOS - Connects to Django Backend & Firebase"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Networking & State
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0

  # UI Components & Loaders
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.1

  # QR Code Scanning (Pure Android/iOS, Zero NDK / Zero JNI)
  qr_code_scanner: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

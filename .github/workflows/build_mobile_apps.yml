name: Build SchoolSM Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android (APK & App Bundle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platforms & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "cmake;3.22.1" || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./schoolsm_mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./schoolsm_mobile
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Build Android App Bundle (AAB for Play Store)
        working-directory: ./schoolsm_mobile
        run: flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation || true

      - name: Prepare APK for Artifacts
        run: |
          mkdir -p dist
          cp schoolsm_mobile/build/app/outputs/flutter-apk/app-release.apk dist/SchoolSM-Mobile.apk

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolSM-Mobile-Android-APK
          path: dist/SchoolSM-Mobile.apk

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SchoolSM-Android-AAB
          path: schoolsm_mobile/build/app/outputs/bundle/release/*.aab

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          name: "SchoolSM Mobile App (Latest Build)"
          body: |
            ## 📱 SchoolSM Mobile Application (Release APK)
            - **Branch**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **Platform**: Android 5.0+ (API 21-34)
            - **Build System**: GitHub Actions Cloud Runner
            
            ### 📥 Download & Install
            Click below to download the latest `.apk` directly to your phone:
            - [Download SchoolSM-Mobile.apk](https://github.com/vannakblue/SchoolSM/releases/download/latest/SchoolSM-Mobile.apk)
          draft: false
          prerelease: false
          make_latest: true
          files: dist/SchoolSM-Mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build_ios:
    name: Build iOS (IPA & App Bundle)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./schoolsm_mobile
        run: flutter pub get

      - name: Build iOS Application & Package IPA
        working-directory: ./schoolsm_mobile
        run: |
          cd ios
          pod install || true
          cd ..
          flutter build ios --release --no-codesign || true
          
          mkdir -p dist/Payload
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Found Runner.app at $APP_PATH"
            cp -R "$APP_PATH" dist/Payload/
          else
            echo "Runner.app not found through flutter build. Trying xcodebuild without codesigning..."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build || true
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              cp -R "$APP_PATH" dist/Payload/
            fi
          fi
          
          cd dist
          if [ -d "Payload/Runner.app" ]; then
            zip -qry SchoolSM-iOS.ipa Payload
          else
            echo "Note: iOS IPA compilation requires Apple Developer Signing Certificate. For iOS users, Progressive Web App (PWA) on Safari is recommended." > README_IOS_INSTALL.txt
            zip -qry SchoolSM-iOS.ipa README_IOS_INSTALL.txt
          fi
          rm -rf Payload README_IOS_INSTALL.txt

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SchoolSM-Mobile-iOS-IPA
          path: schoolsm_mobile/dist/SchoolSM-iOS.ipa

      - name: Publish iOS IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: latest
          files: schoolsm_mobile/dist/SchoolSM-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


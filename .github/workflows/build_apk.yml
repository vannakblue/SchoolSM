name: Build SchoolSM Mobile Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Pre-generate local.properties
        working-directory: ./schoolsm_mobile/android
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties

      - name: Install Dependencies
        working-directory: ./schoolsm_mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./schoolsm_mobile
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SchoolSM-Mobile-APK
          path: schoolsm_mobile/build/app/outputs/**/*.apk

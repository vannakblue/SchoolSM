<div class="timetable-slot">
    <div class="d-flex justify-content-between align-items-start mb-1">
        <strong class="text-dark fs-6">{{ s.subject.name_kh }}</strong>
        {% if is_admin %}
        <div class="d-flex gap-1 no-print">
            <!-- Edit button -->
            <button type="button" class="btn btn-sm btn-link text-primary p-0" title="កែសម្រួលម៉ោងនេះ" onclick="openEditSlotModal('{{ s.id }}', '{{ s.classroom.id }}', '{{ s.subject.id }}', '{{ s.teacher.id }}', '{{ s.day_of_week }}', '{{ s.start_time|time:'H:i' }}', '{{ s.end_time|time:'H:i' }}', '{{ s.room|default:'' }}')">
                <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <!-- Delete button -->
            <a href="{% url 'timetable_delete' s.id %}" class="btn btn-sm btn-link text-danger p-0 ms-1" title="លុប" onclick="return confirm('តើលោកអ្នកចង់លុបម៉ោង {{ s.subject.name_kh }} នេះមែនទេ?')">
                <i class="fa-solid fa-xmark"></i>
            </a>
        </div>
        {% endif %}
    </div>
    
    <div class="text-primary fw-bold small mb-1">
        <i class="fa-regular fa-clock me-1"></i>{{ s.start_time|time:"H:i" }} - {{ s.end_time|time:"H:i" }}
    </div>
    
    <div class="text-muted small">
        <i class="fa-solid fa-chalkboard-user me-1 text-secondary"></i>{{ s.teacher.khmer_name }}
    </div>
    
    {% if s.room %}
    <div class="text-secondary small mt-1" style="font-size: 0.75rem;">
        <i class="fa-solid fa-door-open me-1"></i>{{ s.room }}
    </div>
    {% endif %}
</div>

<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>បញ្ជីបិទផ្សាយតាមបន្ទប់ប្រឡង - ប្រឡងប្រចាំខែ វិច្ឆិកា ថ្នាក់ទី 12</title>
    <!-- Google Fonts: Moul, Kantumruy Pro, Siemreap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Moul&family=Siemreap&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS for toolbar & modal -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Base typography & reset */
        body {
            background-color: #e2e8f0;
            font-family: 'Kantumruy Pro', 'Khmer OS Siemreap', 'Siemreap', sans-serif;
            color: #000000;
            margin: 0;
            padding: 20px 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .moul-font {
            font-family: 'Moul', 'Khmer OS Muol Light', 'Khmer OS Muol', cursive;
            font-weight: normal;
        }

        .kantumruy-font {
            font-family: 'Kantumruy Pro', 'Khmer OS Siemreap', 'Siemreap', sans-serif;
        }

        /* Toolbar on screen */
        .no-print {
            max-width: 210mm;
            margin: 0 auto 20px auto;
        }

        /* A4 Page Printable Sheet */
        .print-sheet {
            background: #ffffff;
            width: 210mm;
            min-height: 297mm;
            max-width: 210mm;
            margin: 0 auto 30px auto;
            padding: 12mm 15mm 12mm 15mm;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
            color: #000000;
            position: relative;
            page-break-after: always;
            break-after: page;
        }

        .print-sheet:last-child {
            margin-bottom: 20px;
        }

        /* Top Header Grid */
        .header-grid {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 6px;
        }

        .top-left-block {
            text-align: center;
            width: 44%;
        }

        .province-name {
            font-size: 11.5pt;
            line-height: 1.4;
            letter-spacing: 0.2px;
        }

        .school-name {
            font-size: 12pt;
            line-height: 1.4;
            margin-top: 1px;
            letter-spacing: 0.2px;
        }

        .room-number-row {
            display: flex;
            align-items: baseline;
            justify-content: flex-start;
            margin-top: 6px;
            padding-left: 10px;
        }

        .room-label {
            font-size: 11pt;
            letter-spacing: 0.2px;
        }

        .room-num-val {
            font-size: 14pt;
            margin-left: 28px;
            letter-spacing: 1px;
        }

        .top-right-block {
            text-align: center;
            width: 44%;
            position: relative;
        }

        .kingdom-title {
            font-size: 12pt;
            line-height: 1.4;
            letter-spacing: 0.2px;
        }

        .kingdom-motto {
            font-size: 11.5pt;
            line-height: 1.4;
            margin-top: 1px;
            letter-spacing: 0.2px;
        }

        .divider-flourish {
            font-size: 11pt;
            line-height: 1.2;
            margin: 2px 0 4px 0;
            letter-spacing: 2px;
            color: #000000;
        }

        .session-row {
            text-align: right;
            padding-right: 5px;
            margin-top: 4px;
        }

        .session-badge-text {
            font-size: 12.5pt;
            letter-spacing: 0.5px;
        }

        /* Center Main Title */
        .center-title-block {
            text-align: center;
            width: 100%;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .main-exam-title {
            font-size: 12.5pt;
            line-height: 1.4;
            letter-spacing: 0.3px;
            margin: 0;
        }

        .sub-exam-date {
            font-size: 11pt;
            line-height: 1.4;
            margin-top: 4px;
            letter-spacing: 0.2px;
        }

        /* 8-Column MoEYS Table */
        .show-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            margin-bottom: 6px;
        }

        .show-table th, .show-table td {
            border: 1px solid #000000;
            padding: 2px 4px;
            font-size: 9.8pt;
            height: 25.5px;
            box-sizing: border-box;
            vertical-align: middle;
            color: #000000;
        }

        .show-table th {
            font-weight: 700;
            text-align: center;
            height: 28px;
            background-color: transparent;
        }

        /* Column Widths (Sum = 100%) */
        .col-index     { width: 5.5%; text-align: center; }
        .col-desk      { width: 7.5%; text-align: center; }
        .col-id        { width: 10.5%; text-align: center; }
        .col-name      { width: 27.5%; text-align: left; padding-left: 8px !important; }
        .col-gender    { width: 6.0%; text-align: center; }
        .col-dob       { width: 20.0%; text-align: center; }
        .col-class     { width: 8.5%; text-align: center; }
        .col-remarks   { width: 14.5%; text-align: center; }

        /* Footer Section */
        .footer-summary {
            font-size: 10pt;
            font-weight: 600;
            text-align: left;
            margin-top: 4px;
            letter-spacing: 0.2px;
        }

        .footer-bottom-grid {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
            padding-right: 25px;
        }

        .signature-block {
            text-align: center;
            min-width: 250px;
        }

        .sign-date-line {
            font-size: 10pt;
            line-height: 1.4;
            letter-spacing: 0.2px;
        }

        .principal-title {
            font-size: 11.5pt;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .signature-spacing {
            height: 55px;
        }

        /* Print Media Styles */
        @media print {
            body {
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
                color: #000000 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-sheet {
                width: 100% !important;
                max-width: 100% !important;
                min-height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always !important;
                break-after: page !important;
            }
            .print-sheet:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }
            @page {
                size: A4 portrait;
                margin: 12mm 15mm 12mm 15mm;
            }
        }
    </style>
</head>
<body>

    <!-- Control Toolbar (Hidden on Print) -->
    <div class="no-print bg-white p-3 rounded-3 shadow-sm border">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-2">
                <a href="/examinations/standardized/240/manage/" class="btn btn-outline-secondary btn-sm fw-bold">
                    <i class="fa-solid fa-arrow-left me-1"></i> ត្រឡប់ក្រោយ
                </a>
                <h6 class="fw-bold mb-0 text-primary">
                    <i class="fa-solid fa-file-lines me-1"></i> បញ្ជីបិទផ្សាយតាមបន្ទប់ (Exam Room Postings)
                </h6>
            </div>

            <div class="d-flex flex-wrap align-items-center gap-2">
                <!-- Room Filter Form -->
                <form method="GET" class="d-flex align-items-center gap-2 mb-0">
                    <!-- Preserve any custom query params -->
                    
                    
                    
                    

                    <select name="room_id" class="form-select form-select-sm fw-bold" style="min-width: 240px;" onchange="this.form.submit()">
                        <option value="">-- បោះពុម្ពគ្រប់បន្ទប់ទាំងអស់ (0 បន្ទប់) --</option>
                        
                    </select>
                </form>

                <!-- Settings Button -->
                <button type="button" class="btn btn-outline-secondary btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#settingsModal">
                    <i class="fa-solid fa-sliders me-1"></i> កំណត់ព័ត៌មានក្បាល/ជើង
                </button>

                <!-- Print Button -->
                <button type="button" class="btn btn-primary btn-sm fw-bold px-3 shadow-sm" onclick="window.print()">
                    <i class="fa-solid fa-print me-1"></i> បោះពុម្ព (Print / PDF)
                </button>
            </div>
        </div>
    </div>

    <!-- Quick Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="GET">
                    
                    <div class="modal-header">
                        <h6 class="modal-title fw-bold" id="settingsModalLabel">
                            <i class="fa-solid fa-pen-to-square me-1"></i> កំណត់ព័ត៌មានក្បាលទំព័រ និងជើងទំព័រ
                        </h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">ខេត្ត/រាជធានី (Province / City)</label>
                            <input type="text" name="province" class="form-control form-control-sm" value="ខេត្តកណ្តាល">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">ឈ្មោះគ្រឹះស្ថានសិក្សា (School Name)</label>
                            <input type="text" name="school_name" class="form-control form-control-sm" value="វិទ្យាល័យ ហ៊ុន សែន កំពង់កន្សួត">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">ទីកន្លែងចុះហត្ថលេខា (Signing Location)</label>
                            <input type="text" name="location" class="form-control form-control-sm" value="កំពង់កន្សួត">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">កាលបរិច្ឆេទចុះហត្ថលេខា (Signing Date)</label>
                            <input type="date" name="sign_date" class="form-control form-control-sm" value="2026-11-20">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">បោះបង់</button>
                        <button type="submit" class="btn btn-primary btn-sm fw-bold">យល់ព្រម & អនុវត្ត</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Printable Sheets per Room (Exactly 1 Room = 1 Page, 25 Rows) -->
    
    <div class="print-sheet text-center py-5">
        <h5 class="fw-bold text-muted moul-font mb-3">មិនទាន់មានបន្ទប់ប្រឡងត្រូវបានបង្កើតនៅឡើយទេ</h5>
        <p class="text-muted">សូមត្រឡប់ទៅផ្ទាំងគ្រប់គ្រងសម័យប្រឡង រួចចុច <strong>«ចែកបន្ទប់ ២៥ នាក់/បន្ទប់»</strong> ជាមុនសិន។</p>
    </div>
    

    <!-- Bootstrap 5 JS for modal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

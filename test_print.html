<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@page {
    size: A4 portrait;
    margin: 0;
}
html, body {
    margin: 0;
    padding: 0;
}
.sheet {
    box-sizing: border-box;
    width: 210mm;
    min-height: 297mm;
    padding: 15mm;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    border: 1px solid black;
    padding: 4px;
}
</style>
</head>
<body>
<div class="sheet">
    <h2>Test Room Notice</h2>
    <table>
        <tr><th>Col 1</th><th>Col 2</th></tr>
        <tr><td>Data 1</td><td>Data 2</td></tr>
    </table>
</div>
</body>
</html>
